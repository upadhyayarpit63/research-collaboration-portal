<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - RPC Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header role="banner">
        <h1>Research Collaboration Portal</h1>
        <p>Reset your password.</p>
    </header>

    <main>
        <section>
            <h2>Forgot Password?</h2>
            <p>This is a demo form. It does not send a password reset email.</p>
            <form action="login.html" method="get">
                <label for="email">Email address</label>
                <input id="email" type="email" placeholder="Enter your registered email" required>
                <button type="submit">SEND RESET LINK</button>
            </form>
            <p><a href="login.html">Back to login</a></p>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 Academic Team Collaboration Portal</p>
    </footer>
</body>
</html>
