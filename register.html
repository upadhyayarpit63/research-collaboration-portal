<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Registration - RPC Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header role="banner">
        <h1>Research Collaboration Portal</h1>
        <p>Create a new account.</p>
    </header>

    <main>
        <section>
            <h2>New Registration</h2>
            <p>This is a demo form. It does not create or save an account.</p>
            <form action="login.html" method="get">
                <label for="full-name">Full name</label>
                <input id="full-name" type="text" placeholder="Enter your full name" required>

                <label for="username">Username</label>
                <input id="username" type="text" placeholder="Choose a username" required>

                <label for="email">Email</label>
                <input id="email" type="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Choose a password" required>

                <button type="submit">CREATE ACCOUNT</button>
            </form>
            <p><a href="login.html">Back to login</a></p>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 Academic Team Collaboration Portal</p>
    </footer>
</body>
</html>
